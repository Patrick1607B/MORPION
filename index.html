<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeu du Morpion</title>
    <link rel="stylesheet" href="./assets/index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Jeu du Morpion</h1>

    <!-- Formulaire de pseudos -->
    <form id="player-form">
        <div class="mb-3" id="form-list-one">
            <label for="name-1" class="form-label">Pseudo joueur 1</label>
            <input type="text" class="form-control" id="name-1">
        </div>
        <div class="mb-3" id="form-list-two">
            <label for="name-2" class="form-label">Pseudo joueur 2</label>
            <input type="text" class="form-control" id="name-2">
        </div>
        <button type="submit" class="btn btn-primary btn-submit">Start Game</button>
    </form>

    <div id="player-start"></div>
    <button id="player-restart" style="display:none;">Restart</button>
    
    <div class="morpion">
        <div class="case case-one"></div>
        <div class="case case-two"></div>
        <div class="case case-three"></div>
        <div class="case case-four"></div>
        <div class="case case-five"></div>
        <div class="case case-six"></div>
        <div class="case case-seven"></div>
        <div class="case case-eight"></div>
        <div class="case case-nine"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="./script.js"></script>
</body>
</html>
